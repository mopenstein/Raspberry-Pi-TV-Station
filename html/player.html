<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local TV Station Emulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        .tv-scale-box {
            aspect-ratio: 1.38; 
            width: 100vw;
            max-height: 100vh;
            max-width: calc(100vh * 1.38);
            container-type: inline-size;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .antenna-assembly {
            position: relative;
            width: 15cqw;
            height: 10cqw;
            margin-bottom: -1cqw;
            z-index: 0;
            flex-shrink: 0;
        }
        .antenna-base {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 8cqw; height: 1.8cqw; background: #222; border-radius: 1.5cqw 1.5cqw 0 0;
            box-shadow: inset 0 0.5cqw 0.5cqw rgba(255,255,255,0.2);
        }
        .antenna-rod {
            position: absolute; bottom: 1.5cqw; width: 0.8cqw; height: 12cqw;
            background: linear-gradient(90deg, #999 0%, #eee 50%, #777 100%); border-radius: 0.4cqw;
        }
        .antenna-rod.left { left: 2cqw; transform-origin: bottom center; transform: rotate(-35deg); }
        .antenna-rod.right { right: 2cqw; transform-origin: bottom center; transform: rotate(45deg); }
        .antenna-tip { position: absolute; top: -0.5cqw; left: -0.3cqw; width: 1.4cqw; height: 1.4cqw; background: #111; border-radius: 50%; }

        .tv-cabinet {
            background: linear-gradient(135deg, #4e3422 0%, #301f12 50%, #1a1005 100%);
            border-radius: 1.5cqw;
            box-shadow: inset 0 0 1.5cqw rgba(0,0,0,0.8), 2cqw 2cqw 5cqw rgba(0,0,0,0.9);
            border: 0.8cqw solid #1a1005;
            display: flex;
            flex-direction: row;
            z-index: 1;
            box-sizing: border-box;
            width: 95cqw;
            padding: 2.5cqw;
            gap: 2.5cqw;
        }

        .bezel {
            background: #1a1a1a;
            padding: 2.5cqw;
            border-radius: 3cqw / 1.5cqw;
            box-shadow: inset 0 0 2cqw #000, 0 0.8cqw 2cqw rgba(0,0,0,0.6);
            border: 0.3cqw solid #333;
            flex-grow: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .screen {
            background-color: #050505;
            width: 100%;
            aspect-ratio: 4 / 3; 
            border-radius: 50% / 5%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 6cqw rgba(0,0,0,1);
            margin: auto; 
        }

        .screen:fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            aspect-ratio: auto;
        }

        #player-frame {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: none; z-index: 1;
        }

        .crt-effects {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            box-shadow: inset 0 0 6cqw rgba(0,0,0,0.9);
            opacity: 0; transition: opacity 0.2s ease;
        }
        .crt-effects::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 60%); z-index: 11;
        }
        @keyframes flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }
        .screen.is-on .crt-effects { opacity: 1; animation: flicker 0.15s infinite; }

        .control-panel {
            width: 18cqw; 
            flex-shrink: 0;
            background: #2a2a2a;
            border-radius: 0.8cqw;
            border: 0.3cqw solid #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2cqw;
            gap: 3cqw;
            box-sizing: border-box;
        }

        .dial-container { display: flex; flex-direction: column; align-items: center; gap: 0.2cqw; }
        .dial-label { color: #777; font-size: 1.4cqw; font-weight: bold; letter-spacing: 0.1cqw; }
        
        .knob {
            width: 6cqw; height: 6cqw; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #555, #111);
            border: 0.4cqw solid #000;
            box-shadow: 0.3cqw 0.4cqw 0.6cqw rgba(0,0,0,0.6);
            position: relative; cursor: pointer; transform: rotate(-30deg);
        }
        .knob::after {
            content: ''; position: absolute; top: 0.8cqw; left: 50%; transform: translateX(-50%);
            width: 0.6cqw; height: 2cqw; background: #ccc; border-radius: 0.2cqw;
        }

        .speaker-grill {
            flex-grow: 1; width: 80%;
            background: repeating-linear-gradient(0deg, #111, #111 0.2cqw, #222 0.2cqw, #222 0.6cqw);
            border-radius: 0.6cqw; border: 0.15cqw solid #000; box-shadow: inset 0 0.8cqw 1.5cqw rgba(0,0,0,0.8);
        }

        /* --- New Power Knob --- */
        .power-knob {
            width: 3cqw; height: 3cqw; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #444, #111);
            border: 0.3cqw solid #000;
            box-shadow: 0.3cqw 0.4cqw 0.6cqw rgba(0,0,0,0.6);
            position: relative; cursor: pointer; 
            transition: transform 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        .power-knob::after {
            content: ''; position: absolute; top: 0.5cqw; left: 50%; transform: translateX(-50%);
            width: 0.4cqw; height: 1.0cqw; background: #999; border-radius: 0.2cqw;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        /* Rotates 90 degrees and glows red when activated */
        .power-knob.is-on {
            transform: rotate(90deg);
        }
        .power-knob.is-on::after {
            background: #ff5252;
            box-shadow: 0 0 0.5cqw #ff5252;
        }

        .buttons { display: flex; flex-direction: column; gap: 2cqw; width: 100%; margin-bottom: 0.5cqw; }
        .chunky-btn {
            background: #1a1a1a; color: #9e9e9e; 
            border: 0.3cqw solid #000; border-top-color: #444; border-left-color: #444;
            padding: 1.5cqw; font-family: inherit; font-weight: bold; font-size: 1.8cqw; cursor: pointer;
            border-radius: 0.6cqw; transition: all 0.1s;
        }
        .chunky-btn:active {
            border-top-color: #000; border-left-color: #000; border-bottom-color: #444; border-right-color: #444;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <div class="tv-scale-box">
        <div class="antenna-assembly">
            <div class="antenna-rod left"><div class="antenna-tip"></div></div>
            <div class="antenna-rod right"><div class="antenna-tip"></div></div>
            <div class="antenna-base"></div>
        </div>

        <div class="tv-cabinet" id="tv-cabinet">
            <div class="bezel">
                <div class="screen" id="screen">
                    <iframe id="player-frame" src="web-player.php"></iframe>
                    <div class="crt-effects"></div>
                </div>
            </div>
            
            <div class="control-panel">
                <div class="dial-container">
                    <div class="dial-label">VHF</div>
                    <div class="knob"></div>
                </div>
                <div class="dial-container">
                    <div class="dial-label">UHF</div>
                    <div class="knob" style="transform: rotate(60deg);"></div>
                </div>
                
                <div class="speaker-grill"></div>
                
				<div class="dial-container">
                    <div class="dial-label">Full</div>
                    <div class="power-knob" id="fullscreen-btn"></div>
                </div>

                <!-- Replaced Power Button with smaller knob -->
                <div class="dial-container">
                    <div class="dial-label">POWER</div>
                    <div class="power-knob" id="power-btn"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const screen = document.getElementById('screen');
        const powerBtn = document.getElementById('power-btn');
        const playerFrame = document.getElementById('player-frame');
        
        let isActive = false;

        powerBtn.addEventListener('click', () => {
            isActive = !isActive;
            
            if (isActive) {
                powerBtn.classList.add('is-on');
                screen.classList.add('is-on');
            } else {
                powerBtn.classList.remove('is-on');
                screen.classList.remove('is-on');
            }

            playerFrame.contentWindow.postMessage({ 
                command: 'power', 
                state: isActive 
            }, '*');
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                screen.requestFullscreen().catch(err => {
                    console.error("Error attempting to enable fullscreen:", err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data && data.status) {
                if (data.status === 'stopped' && isActive) {
                    isActive = false;
                    powerBtn.classList.remove('is-on');
                    screen.classList.remove('is-on');
                }
            }
        });
    </script>
</body>
</html>
